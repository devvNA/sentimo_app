name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: Code Quality Analysis
  analyze:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Show Flutter version
        run: flutter --version
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: true
      
      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos
      
      - name: Check for outdated dependencies
        run: flutter pub outdated
        continue-on-error: true

  # Job 2: Unit & Widget Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          SUPABASE_URL=https://test.supabase.co
          SUPABASE_ANON_KEY=test_key_for_ci
          GEMINI_API_KEY=test_gemini_key_for_ci
          GOOGLE_WEB_CLIENT_ID=test_web_client_id
          GOOGLE_IOS_CLIENT_ID=test_ios_client_id
          EOF
      
      - name: Run tests
        run: flutter test --coverage --reporter expanded
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            coverage/
            test/
          retention-days: 30

  # Job 3: Build Android Debug APK
  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          cat > .env << EOF
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder_key
          GEMINI_API_KEY=placeholder_gemini_key
          GOOGLE_WEB_CLIENT_ID=placeholder_web_client
          GOOGLE_IOS_CLIENT_ID=placeholder_ios_client
          EOF
      
      - name: Build Android Debug APK
        run: flutter build apk --debug --no-shrink
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v3
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # Job 4: Build iOS (macOS only)
  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          cat > .env << EOF
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder_key
          GEMINI_API_KEY=placeholder_gemini_key
          GOOGLE_WEB_CLIENT_ID=placeholder_web_client
          GOOGLE_IOS_CLIENT_ID=placeholder_ios_client
          EOF
      
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
      
      - name: Archive iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../ios-debug.zip Runner.app
      
      - name: Upload iOS build
        uses: actions/upload-artifact@v3
        with:
          name: ios-debug-build
          path: ios-debug.zip
          retention-days: 7

  # Job 5: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run dependency vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'pubspec.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # Job 6: Summary & Notifications
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Code Analysis: ${{ needs.analyze.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Build: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
